<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TopicMaster</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="screen" id="home">
<h1>🎤 TopicMaster</h1>
<p>Тренажёр публичных выступлений</p>
<button id="startBtn">Начать</button>
</div>

<div class="screen hidden" id="setup">
<h2>Выберите категории</h2>
<div id="cats"></div>
<h3>Подготовка</h3>
<select id="prep"><option>5</option><option>15</option><option>30</option><option selected>60</option></select>
<h3>Выступление</h3>
<select id="speech"><option selected>1</option><option>3</option><option>5</option><option>10</option></select>
<button id="spinBtn">Крутить рулетку</button>
</div>

<div class="screen hidden" id="roulette">
<h2>Рулетка</h2>
<div id="slot">Нажмите «Крутить»</div>
<button id="goPrep">Начать подготовку</button>
</div>

<script src="script.js"></script>
</body></html>
